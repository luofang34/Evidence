[[requirements]]
uid = "3782184e-8bc6-40d2-bfba-60803fb2d1f2"
id = "SYS-036"
title = "Absence of assurance evidence is an adoption state, never a verification success"
owner = "soi"
scope = "soi"
description = """
Every assurance claim the tool evaluates — a requested trace
validation, a cert or record bundle generation, a source check, or
a bundle verification — is a claim about evidence that must exist.
A missing trace root, an empty trace tree, or a requirement set
with zero in-scope entries is an adoption state of the project
under audit, not evidence satisfying the claim.

The tool shall distinguish not-configured, not-adopted, empty,
invalid, and valid evidence states, and shall fail closed on every
state that carries no evidence: no command, doctor check,
generation phase, or verifier shall emit a success terminal for a
requested assurance claim over no evidence. Development-mode
surfaces may report an explicit non-success adoption diagnostic so
iteration stays unblocked, but the diagnostic shall name the
adoption state rather than report validity.
"""
verification_methods = [
    "test",
    "review",
]
traces_to = []

[[requirements]]
uid = "7cee4f62-6321-439b-96da-9d73511aad0b"
id = "SYS-037"
title = "Coverage percentages are engineering metrics, never compliance proof; cert claims require explicit assurance selection"
owner = "soi"
scope = "soi"
description = """
Structural-coverage percentages (statement, branch) are engineering
quality metrics, not DO-178C compliance verdicts. The structural
coverage objectives of DO-178C Annex A Table A-7 are
objective-driven: uncovered structure requires analysis and
disposition, and no fixed percentage closes an objective (FAA
AC 20-115D / DO-178C A-7). LLVM branch coverage approximates
decision coverage; approximate evidence cannot be silently
promoted to semantic decision or MC/DC evidence.

The tool shall record coverage metrics, uncovered items,
analysis/disposition records, tool identity and qualification, and
manual or independent review outcomes as separate evidence kinds,
and shall never map a percentage alone to a satisfied A-7
objective: approximate or unqualified evidence yields a
manual-review or unsupported verdict, never Met.

Certification and record evaluation shall require an explicit
assurance selection — a standard edition and an assurance level
recorded in cert/boundary.toml — and shall fail closed when that
selection is missing. Development-mode evaluation shall name
itself unclassified rather than silently assuming the least
stringent assurance level, so a missing configuration can never
weaken an intended claim unnoticed. Every standard-to-objective
mapping the tool applies shall be bound to a versioned,
expert-reviewed standards pack with an applicability and
tailoring record.
"""
verification_methods = [
    "test",
    "review",
]
traces_to = []

[[requirements]]
uid = "e8c91756-c711-41be-869f-1b6e94e0968d"
id = "SYS-038"
title = "Approval binds versioned canonical normative requirement content, never identity or presentation"
owner = "soi"
scope = "soi"
description = """
A human approval of a requirement shall bind the requirement's
normative content — its title, decomposition layer, description,
rationale, scope, category, source reference, verification methods,
and canonical decomposition targets — through a versioned canonical
projection and a stable SHA-256 digest of that projection, never the
short title alone while normative prose or assurance-relevant
metadata silently changes underneath.

The requirement's permanent uid is bound separately by the review
record and is not part of the digest. Identity and presentation
concerns are excluded from the approved content: the human
identifier and namespace (renameable under DD-4), owner, sort_key,
implementation modules, governed surfaces, emitted diagnostic
codes, file path, TOML layout, file order, and record order. An
approved requirement can acquire implementation and test mappings
without invalidating its approval.

Every set-like list is sorted and duplicate-free before encoding,
and parsed strings are hashed exactly as written with no whitespace
or Unicode normalization. The projection is encoded in one
documented canonical byte format behind a domain/version tag;
changing the encoding contract requires a new projection version,
never a silent change of existing digests.
"""
verification_methods = [
    "test",
    "review",
]
traces_to = []

[[requirements]]
uid = "e6e5c8b3-d429-460f-bdfc-3020ff1cfebf"
id = "SYS-039"
title = "Human review decisions are strict typed corpus records bound to a requirement uid and an exact reviewed-content digest"
owner = "soi"
scope = "soi"
description = """
A human review decision on a requirement shall be recorded as a
strict, typed corpus record — never free-form prose — bound to the
reviewed requirement's permanent uid and the exact SHA-256 digest of
the canonical review content the decision covers. The record schema
shall fail closed on unknown fields, unsupported record or content
schema versions, malformed uids, digests, or timestamps, an empty
reviewer identity, and a rejection without a rationale, and every
failure shall name the file and the record.

The reviewer field records an organization-stable human identity for
audit; the tool shall never accept it as proof that a caller is
human. The reviewed-at timestamp is audit metadata too and shall
never choose which decision is effective.

A reviewer corrects their own earlier decision through a superseding
review over the same requirement content. Supersession shall be
deterministic: a superseding review names the same reviewer,
requirement uid, and reviewed digest as its predecessor, and
dangling, cyclic, forked, self-referential, cross-reviewer,
cross-requirement, and cross-digest chains are rejected. Multiple
independent reviewers may review the same content, and review file
layout and load order carry no semantic meaning.
"""
verification_methods = [
    "test",
    "review",
]
traces_to = []

[[requirements]]
uid = "9612ccb9-294a-4682-88b3-b78cbd34e7e6"
id = "SYS-040"
title = "Every requirement's effective lifecycle state is derived deterministically from digest-bound reviews, never stored"
owner = "soi"
scope = "soi"
description = """
Every requirement shall have exactly one effective lifecycle state
— candidate, approved, rejected, or stale — derived by a pure
evaluation over the requirement's review records, never stored as
a mutable field on the requirement and never toggled by any
caller. The evaluation shall bind exact content: a review decision
is effective only when its reviewed-content digest equals the
requirement's current review-content digest, and only
non-superseded reviews shall be effective.

Rejection shall be fail-closed and take precedence over approval:
any effective rejection binding the current digest yields
rejected. Otherwise at least one effective approval binding the
current digest yields approved. Otherwise an effective approval
of older content of the same requirement yields stale. Otherwise
the requirement is a candidate, including a new requirement and
revised content whose only older decisions were rejections.
Returning content to a previously approved exact digest shall
yield approved again, because the digest binds exact content.

The evaluation shall be deterministic: review timestamps, file
layout, file order, record order, and host shall never affect the
result, and reporting shall iterate requirements in uid order. An
approval whose requirement is missing from the graph is invalid
graph data and shall fail closed; malformed supersession
histories shall stay rejected at graph validation and shall never
be masked by lifecycle evaluation. The repository history remains
the audit trail for the reviewed bytes.
"""
verification_methods = [
    "test",
    "review",
]
traces_to = []

[[requirements]]
uid = "1768262e-5524-477b-be35-c479623aa19c"
id = "SYS-041"
title = "Implementation and verification evidence may claim only approved requirements under explicit lifecycle enforcement"
owner = "soi"
scope = "soi"
description = """
The tool shall provide a strict validation policy that prevents
implementation or verification evidence from claiming an
unapproved requirement: when lifecycle enforcement is explicitly
required, every test-to-requirement verifies edge shall target an
approved requirement, and every requirement that claims
implementation modules or emitted implementation diagnostics
shall be approved.

The enforcement decision shall be explicit: the caller shall name
the policy through a dedicated input, and strictness shall never
be inferred from an implicit design-assurance fallback. A caller
that has not adopted corpus lifecycle simply does not request
this policy; legacy nodes shall never be grandfathered as
approved inside the evaluator, and the distinction shall be
explicit in the API rather than detected from file paths.

When enforcement is required, candidate, rejected, and stale
targets shall each produce distinct typed non-success diagnostics
carrying the requirement uid, the human-readable identifier, the
lifecycle state, and the referring artifact or test. Missing
reviews shall be treated as candidate, never implicitly approved,
and an empty lifecycle review set shall never satisfy an
explicitly requested approval claim. Requirement decomposition
edges shall remain structurally valid for candidate authoring:
this policy gates implementation and verification consumption,
not the ability to draft a requirement hierarchy.
"""
verification_methods = [
    "test",
    "review",
]
traces_to = []

[[requirements]]
uid = "2b6633a7-527b-42d4-9af2-ce22b80eda56"
id = "SYS-042"
title = "Agent write authority over the corpus is one narrow append-only candidate-proposal capability that leaves the baseline, reviews, and sources byte-identical"
owner = "soi"
scope = "soi"
description = """
The tool shall give agent-facing code exactly one write capability
over the requirements corpus: appending a candidate proposal
beneath a caller-supplied proposal root. A proposal shall either
describe a complete new candidate requirement or carry complete
replacement content for an existing candidate together with the
expected current content digest for optimistic concurrency.
Appending a proposal shall never apply it: the corpus baseline,
review records, and frozen source files shall remain byte-for-byte
unchanged by any submission, and human acceptance plus public
queue and review surfaces are separate work above this layer.

Authority shall be enforced through types and available
operations, never through a self-declared actor field: review
creation, lifecycle mutation, source mutation, and baseline
writes shall be absent from the agent-facing interface, and
approval, rejection, deletion, review mutation, source mutation,
baseline replacement, and direct file-path writes shall be
unrepresentable as proposal actions. Submitter identity and
submission time shall be recorded as audit metadata and shall
never confer authority or ordering.
"""
verification_methods = [
    "test",
    "review",
]
traces_to = []

[[requirements]]
uid = "21472521-3496-411f-8832-8c73ca7732a2"
id = "SYS-043"
title = "A frozen source document revision is a strict typed corpus graph node keyed by a stable document lineage"
owner = "soi"
scope = "soi"
description = """
The tool shall represent one frozen revision of a source document as
a strict, typed corpus graph node — a source revision — never as
free-form prose or a bare location string. Revisions of one logical
document shall group under a stable, non-empty document lineage key,
and each revision shall carry a permanent `src_<UUIDv4>` identity, a
human-readable revision identifier unique within the source-revision
kind, a title, a media type, and a canonical location preserved
exactly as audit identity.

Every revision shall declare its material state explicitly.
Available material carries an RFC 3339 retrieval timestamp recorded
as audit metadata and never as ordering authority, a validated
lowercase SHA-256 digest, and exactly one capture mode — vendored
bytes beneath the corpus payload root, a hash-only record, or an
immutable identifier in an external controlled document system.
Unavailable material carries a non-empty reason and no invented
digest, and shall never be reportable as byte-verified; unavailable
revisions are valid graph state and remain distinguishable from
available content.

The record schema shall fail closed on unknown fields, a newer
schema version, malformed identities, digests, media types, or
timestamps, blank required strings, incomplete capture
combinations, and unsafe or non-canonical vendored paths, naming
the file and the record in every failure. Source file layout and
record order carry no semantic meaning.
"""
verification_methods = [
    "test",
    "review",
]
traces_to = []

[[requirements]]
uid = "59138efe-ffe9-4bfb-8224-3447a9764670"
id = "SYS-044"
title = "Source document revisions form one immutable single-chain lineage per document and baseline transitions fail closed on mutation"
owner = "soi"
scope = "soi"
description = """
The tool shall treat source document revisions as immutable graph
objects. A new capture for the same logical document shall extend
one explicit revision chain through a typed supersedes link owned
by the newer revision and pointing at the prior revision; editing
an existing revision in place or creating an unrelated competing
head shall fail closed. Source supersession shall be validated
through a source-domain validator separate from review
supersession, and a supersession link shall require both revisions
to share one document lineage key.

Each document lineage shall be a single acyclic chain: one root,
at most one predecessor and at most one successor per revision,
and exactly one effective head. Dangling targets, self-links,
cycles, forks, cross-document links, duplicate outgoing edges,
and multiple unrelated roots for one document key shall each fail
closed with distinct typed context.

A baseline transition shall be a pure comparison between a prior
validated baseline and a proposed validated baseline, scoped to
the source-revision subgraph so unrelated node kinds never affect
the outcome. The proposed subgraph shall be a UID-preserving
superset of the prior one: every retained revision shall keep a
byte-for-byte-equivalent typed immutable projection covering every
revision field plus its owned supersession edge set, and silent
removal, in-place mutation, digest replacement, or a new unlinked
competing revision shall each be a distinct typed error. A changed
digest at the same logical document shall therefore require a new
`src_` identity and a supersedes link. The effective source head
of each document key shall be a deterministic derived view in
which timestamps and file order never select a head. Correctness
shall depend only on the core graph API; repository history is
audit evidence and shall never be parsed for correctness.
"""
verification_methods = [
    "test",
    "review",
]
traces_to = []

[[requirements]]
uid = "a0ce5b90-094a-4428-92e1-a6d209dee9f7"
id = "SYS-045"
title = "The active frozen-source baseline inventory is a canonical derived lock with exact three-gate validation"
owner = "soi"
scope = "soi"
description = """
The tool shall define `cert/sources.lock` as the canonical, derived
inventory of the active frozen-source baseline. Source-revision
registry records shall remain authoritative; the lock shall carry no
independent editable semantics and shall equal a fresh projection
from the validated corpus graph. The lock schema shall be strict and
versioned: one entry per effective document lineage key, sorted
canonically, binding the effective source revision identity, the
availability state, the lowercase content SHA-256 when available,
the capture mode, and the immutable external control identity when
that identity is part of the capture contract. Vendored file paths
and record-file layout shall be storage details and never enter
source identity; historical non-head revisions shall remain in the
registry and lineage but never appear as active lock entries.

Deriving the lock value from a validated graph, rendering canonical
bytes, parsing strict lock bytes, and comparing a committed lock
against the derived value shall be pure operations. Committed-lock
validation shall apply three ordered gates — strict parse, byte
equality with the canonical rendering, and value equality with the
derived projection — and shall fail closed with typed context for
missing, extra, changed, malformed, non-canonical, and
unsupported-version entries. An unavailable effective source shall
be represented explicitly and shall never receive a synthetic
digest. The lock shall prove which source digests and availability
states the corpus baseline selected; it shall not claim recipe
reproducibility, remote retrievability, or vendored byte integrity.
Validation shall never mutate the workspace.
"""
verification_methods = [
    "test",
    "review",
]
traces_to = []

[[requirements]]
uid = "e895b27c-6fe8-4f35-9e65-cfd8b6e6771f"
id = "SYS-046"
title = "The material behind each effective source revision is verifiable offline with honest per-capture assurance states"
owner = "soi"
scope = "soi"
description = """
The tool shall validate the material behind each effective source
revision without network access and without overstating what each
capture mode proves. Verification shall report deterministic typed
states distinguishing: vendored bytes read and matched against the
locked digest (byte-verified); hash-only content whose declared
digest is valid but for which no local bytes exist (digest
declared); external-controlled content with a valid immutable
control identity and declared digest but no local byte claim
(externally controlled); and explicitly unavailable material
carrying its recorded reason. Only the first state shall be local
byte verification; schema-valid, locked, and byte-verified shall
remain separate facts, and unavailable material shall be reportable
and lintable but shall never satisfy a byte-verified policy.

Vendored verification shall resolve the canonical relative vendored
path beneath the fixed `<corpus-root>/sources/` payload root —
never against an arbitrary caller-selected directory — and shall
reject missing paths, non-files, symlink payload roots, symlink
path components, and any filesystem resolution escaping the payload
root before hashing the exact raw bytes and comparing them against
the source revision and `sources.lock` digests, with typed errors
carrying the source uid, document key, path, and digests. Graph
validation, lock parsing and canonicality, and graph-lock equality
shall be global prerequisites whose failure stops payload
verification; after they pass, every effective head shall produce
exactly one verification entry sorted deterministically by document
key and source uid, and one bad payload shall never hide findings
for later heads. Hash-only verification shall never fetch during
validation, external-controlled verification shall never contact
the external system, and retrieval timestamps shall remain audit
metadata that never affects ordering or success selection.
Validation shall never mutate registry, lock, review, or payload
files.
"""
