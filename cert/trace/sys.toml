The tool shall represent supported certification artifacts as one
typed, uid-keyed graph loaded from linked TOML files indexed by
`cert/corpus.toml`. File layout and input edge order carry no
semantic meaning: equivalent entries under any indexed arrangement
produce the same graph. Traceability reports are derived views of
this graph.

The legacy `cert/trace` adapter loads requirement and test nodes
with the same uid set, human identifiers, titles, trace edge sets,
and test selectors as the legacy parser. Graph edge ordering is
canonical.
"""
