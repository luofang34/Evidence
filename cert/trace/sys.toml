derived only from facts known at generation time; a state the
generator cannot substantiate shall be recorded as incomplete or
unverifiable, never optimistically complete. A bundle the verifier
rejects shall never report verification completeness, and empty
input, output, or trace data shall never report capture or graph
completeness for an in-scope claim.

The bundle comparison shall examine every assurance-relevant
content category — scope, trace graph, tests and row-level
results, coverage, commands, recipe, inputs, outputs,
objective/profile mappings, reviews/approvals, anomalies,
tool/qualification identity, integrity/signature state, derived
completeness states, and the whole-content hash — and report each
category as equal, added, removed, changed, or unverifiable with
deterministic detail lines. Categories whose artifacts are missing
or unparseable shall be reported unverifiable with the reason, and
the comparison shall never imply "no changes" while unexamined
content may differ.
"""
