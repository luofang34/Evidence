    "test",
    "review",
]
traces_to = []

[[requirements]]
uid = "9b00e1b0-9b21-42c8-a24a-9ae5d44e0c98"
id = "SYS-035"
title = "Certification data is a single typed corpus graph"
owner = "soi"
