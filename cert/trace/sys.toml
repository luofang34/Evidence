[[requirements]]
uid = "1ed39bb5-5c84-4068-b1ec-b588e7cfbf9d"
id = "SYS-048"
title = "Bundle recipe identity is canonical, and reproduced-output equality is defined over input, recipe, and output digest planes"
owner = "soi"
scope = "soi"
description = """
The bundle shall record a canonical recipe identity covering the
target triple, feature selection, build profile, locked dependency
graph, toolchain (rustc / cargo / LLVM / rust-toolchain.toml /
RUSTFLAGS), dependency-resolution policy, source-input digests,
and the exact command recipe, so two bundles can be classified as
same-recipe or different-recipe without consulting host-specific
metadata.

The identity hash recorded in `index.json` shall be named for what
it proves — `recipe_hash`, the SHA-256 of the committed recipe
manifest — and shall never be presented as proof that build outputs
reproduce. Same-recipe is a claim about declared build identity;
reproduced outputs are a separate, stronger claim.

Reproduced-output comparison shall be defined over three digest
planes: the canonical source-input digests, the recipe/target
identity, and the recorded output digests. Two bundles compare
reproduction-equal iff all three planes compare equal. Every
difference — changed, missing, extra, or unverifiable inputs,
recipe fields, or outputs — shall surface as a typed comparison
finding, never as a bare boolean or a panic.

Cross-host recipe parity (the toolchain-projection agreement of
SYS-003) shall be treated as a distinct claim from
reproduced-output equality: target artifacts legitimately differ
across hosts, so output-digest equality is a same-target
comparison while recipe parity is the cross-host one.
"""
