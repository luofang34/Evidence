owner = "tool"
traces_to = ["d5fa6b1b-315e-4cce-9a39-085cd266f4ad"]
description = """
Positive dogfoods: every banned-narration shape in Rust comments —
line, outer doc, inner doc, block, multi-line block (hit reported
at the middle line), and nested block — fires the gate. Negative
dogfoods: the same words inside string literals, raw strings (any
hash count), URLs, char literals, and lifetimes stay runtime data
and do not fire. Also asserts the workspace's current tree is
clean, that the exemption mechanism carries no `path:line` pins,
and that a clean fixture passes.
"""
