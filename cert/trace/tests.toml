[[tests]]
uid = "af0b2d2c-1f59-49f5-9480-17a956929127"
id = "TEST-081"
title = "ToolResponse.success boolean across all four shapes + happy/failure paths"
owner = "tool"
traces_to = ["c27cc5cb-ab24-4928-8d5c-2a2bdeb0659d"]
description = """
Coverage matrix for the success boolean derivation:

  - `JsonlToolResponse`: success is true on a `_OK`-terminal +
    exit 0 (verify happy path); false on a `_FAIL` terminal + exit 2
    (verification failure); false on an `MCP_*` terminal + exit 2
    (tool-layer failure synthesized when subprocess can't spawn).
  - `RulesToolResponse`: success is true when `error.is_none()` +
    exit 0; false when subprocess produced unparseable JSON
    (`error = Some(MCP_MALFORMED_RULES_BLOB)`); server-layer
    warnings (version-skew prepends) leave success unchanged.
  - `DiffToolResponse`: success is true on exit 0 even when bundles
    differ (diff reports, doesn't judge); false on tool-layer
    failure.
  - `PingResponse`: not part of this contract — ping has no failure
    path that would warrant a success bool, and its three skew
    states are already structured.
"""
test_selectors = [
    "evidence_mcp::server::responses::tests::jsonl_response_success_true_on_ok_terminal",
    "evidence_mcp::server::responses::tests::jsonl_response_success_false_on_fail_terminal",
    "evidence_mcp::server::responses::tests::jsonl_response_success_false_on_mcp_synthetic",
    "evidence_mcp::server::responses::tests::rules_response_success_true_when_error_none",
    "evidence_mcp::server::responses::tests::rules_response_success_false_when_error_some",
    "evidence_mcp::server::responses::tests::rules_response_warnings_do_not_flip_success",
    "evidence_mcp::server::responses::tests::diff_response_success_true_when_error_none",
    "evidence_mcp::server::responses::tests::diff_response_success_false_when_error_some",
]

