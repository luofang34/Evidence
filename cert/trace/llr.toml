The reviewed-content encoding covers the canonical patch
intent: the domain/version tag
`evidence/curated-patch/v1`, the source-revision uid, the
recipe, input, and pre-patch graph digests, then every
operation in canonical ordinal order with all of its
preconditions and payload fields under length-prefixed
framing, so no field-boundary collision is possible and
the encoding is disjoint from every other corpus
encoding. Author, rationale, creation metadata, the patch
uid, and the human id never enter the encoding. The
canonical source-graph digest renders one revision's
committed nodes in uid order through the canonical
rendering contract under the domain/version tag
`evidence/source-graph-digest/v1` and hashes those bytes;
equivalent layouts digest identically and any structural
difference moves the digest. Both digests are validated
structural digests, golden byte-locked.
"""
verification_methods = ["test"]

[[requirements]]
uid = "dee14942-5ba7-4d15-9e9e-30698c3560ab"
id = "LLR-168"
title = "corpus::source_patch::apply carries the atomic precondition-checked candidate application contract"
owner = "tool"
traces_to = [
    "8fbe8ec4-172a-41ce-9754-5331b86e16ff",
    "c663d7a6-29af-4675-b7f3-2dd6b8dedd3b",
]
modules = ["evidence_core::corpus::source_patch::apply"]
description = """
`apply_patch` validates the parser graph through the
standalone source-graph validator before any change,
verifies the recipe, input, and pre-patch graph digest
bindings, then applies operations in canonical ordinal
order against a working copy: each operation checks its
exact preconditions — expected content digest, expected
kind, expected parent and ordinal, expected parent for
insert, expected digest and explicit child disposition
for remove — and fails closed with a typed stale-
precondition error naming the operation ordinal, target,
field, and both values when the state has moved.
Cross-document edits, dangling targets, inserted-uid
collisions, and implicit cascades fail with their own
typed errors. After the last operation the complete
source-graph validator runs over the result; an invalid
post-graph fails closed. Application is atomic: any
failure discards the working copy and the original graph
is byte-identical. The returned `PatchApplication`
records the pre-patch digest, the patch reviewed-content
digest, the post-patch digest, and the candidate graph as
a separately inspectable plane — never merged into the
committed parser graph and carrying no review-lifecycle
or approval semantics.
"""
verification_methods = ["test"]

[[requirements]]
uid = "4d6c989d-032b-4c5a-8c03-963440ea987e"
id = "LLR-169"
title = "corpus graph and index wire curated patches as a separately inspectable committed plane"
owner = "tool"
traces_to = ["c663d7a6-29af-4675-b7f3-2dd6b8dedd3b"]
modules = ["evidence_core::corpus::source_patch"]
description = """
The corpus index gains a `source_patches` kind loading
curated-patch files after source graphs, so patch binding
validates against present revisions and graphs, and
before requirements. `CorpusGraph` carries the committed
patch plane in a uid-keyed `BTreeMap` with per-kind
human-id uniqueness enforced at insertion, exposed
read-only alongside the parser-output source graphs so
the two planes stay separately inspectable. Corpus
validation re-checks every committed patch against the
committed graph: the bound source revision must exist,
the pre-patch graph digest must match the canonical
digest of that revision's committed parser graph, every
non-insert operation target must resolve inside the bound
revision — present in another revision is a
cross-document edit, absent everywhere is dangling — and
no operation may target another patch's inserted node
implicitly. `CorpusError::SourcePatch` wraps the flat
typed `SourcePatchError` so loading and validation keep
one error type.
"""
verification_methods = ["test"]

[[requirements]]
uid = "65987707-2e2a-428f-aae9-a80c57ca6eb3"
id = "LLR-170"
title = "review record loader resolves the closed typed target under the schema-1 to schema-2 transition"
owner = "tool"
traces_to = ["7dedefb9-7c1a-4df3-b5ef-280bf53a831c"]
modules = ["evidence_core::corpus::review_records"]
description = """
`SUPPORTED_REVIEW_SCHEMA` rises to 2. A schema-2 record
carries `target = { kind, uid }` with a closed
snake_case kind enum (`requirement`, `curated_patch`) and
unknown fields denied, so a generic kind string fails
deserialization; the uid is validated against the kind's
typed prefix (`req_<UUIDv4>` or `patch_<UUIDv4>`). A
schema-1 record keeps the legacy `requirement_uid` field
and loads as a requirement target with identical
semantics, digests, and error precedence. The two shapes
never mix: a typed target in a schema-1 record, a legacy
field in a schema-2 record, both fields, or neither fails
closed with a typed shape error naming the file path and
record identity. Files declaring a schema newer than 2
fail closed through the existing schema gate, so older
tools reject schema-2 files rather than ignoring
target-kind fields. Record validation order and all other
field checks are unchanged.
"""
verification_methods = ["test"]

[[requirements]]
uid = "8be8a53b-155c-4c23-a223-a39dac01b1e7"
id = "LLR-171"
title = "graph validation enforces exactly one reviews edge matching the typed target and its endpoint plane"
owner = "tool"
traces_to = ["7dedefb9-7c1a-4df3-b5ef-280bf53a831c"]
modules = ["evidence_core::corpus::graph"]
description = """
The corpus graph resolves a review's `Reviews` edge against
exactly the endpoint its typed target declares: a
requirement target resolves to a requirement node, a
curated-patch target resolves to the committed patch
plane, and nothing else — an arbitrary node target is
rejected. The per-node review invariants generalize: each
review node carries exactly one `Reviews` edge whose target
equals the typed target uid, and the declared target kind
must match the plane the edge resolves to, so a cross-kind
uid/edge mismatch fails closed with a typed error naming
the review. `ReviewNode` carries the typed
`ReviewTarget` (`Requirement` or `CuratedPatch`) in place
of the bare requirement uid; review uid identity and the
`content_schema` gate are unchanged.
"""
verification_methods = ["test"]

[[requirements]]
uid = "ca1f0bf8-e7fc-4152-aaec-8bdfc795e2fa"
id = "LLR-172"
title = "review supersession is enforced within one target kind and target uid"
owner = "tool"
traces_to = ["cec2bc64-a14f-426f-ac76-a2dff9a5c756"]
modules = ["evidence_core::corpus::graph"]
description = """
Supersession chain validation generalizes the
same-requirement rule to the typed target: a superseding
review must name the same reviewer, the same typed target
— kind and uid — and the same reviewed-content digest as
its predecessor, so cross-target supersession fails
closed. Self-supersession, dangling predecessors, forks,
cycles, and multiple outgoing `Supersedes` edges remain
hard errors, checked in uid-sorted order so the reported
violation is deterministic. Requirement-only chains
validate exactly as before.
"""
verification_methods = ["test"]

[[requirements]]
uid = "b21c9c2a-cb06-4fe1-933c-d45764ff8208"
id = "LLR-173"
title = "patch lifecycle evaluation derives one effective state per patch from digest-bound review heads"
owner = "tool"
traces_to = ["cec2bc64-a14f-426f-ac76-a2dff9a5c756"]
modules = ["evidence_core::corpus::patch_lifecycle"]
description = """
`evaluate_patch_lifecycle` and
`evaluate_all_patch_lifecycles` validate the whole graph
once per call, then derive each committed patch's
effective state as a pure view: the current digest is the
patch record's `evidence/curated-patch/v1`
reviewed-content digest, the effective heads are the
non-superseded reviews targeting the patch, and the truth
table is the requirement one — current-digest rejection,
then current-digest approval, then older-digest approval
yields stale, else candidate. Reviewer composition and
rejection precedence are explicit and identical to
requirements; `reviewed_at`, layout, and record order
never enter the decision. A review targeting a missing
patch fails closed; requirement lifecycle behavior is
unchanged.
"""
verification_methods = ["test"]

[[requirements]]
uid = "5f209399-7d3d-4b53-bf22-7415fbcacd75"
id = "LLR-174"
title = "the effective source graph applies only currently approved patches in uid order and fails closed"
owner = "tool"
traces_to = ["b38bb4e4-c479-4973-830a-802111cc1cad"]
modules = ["evidence_core::corpus::effective_graph"]
description = """
`effective_source_graph` validates the corpus graph,
derives every committed patch's lifecycle, and produces
the bound revision's effective structural graph: the
committed parser graph with exactly the approved patches
of that revision applied in patch uid order through the
atomic precondition-checked application contract.
Candidate, rejected, and stale patches never contribute;
an approved patch whose bindings or preconditions no
longer hold fails closed with a typed error rather than
being silently skipped. The result records the applied
patch uids, so effective curated content always carries
its approval proof. The function is pure — no I/O, no
mutation of the committed graph — and independent of
record layout and load order.
"""
verification_methods = ["test"]

[[requirements]]
uid = "0bf01c65-a559-4e81-8739-21a45a575fe7"
id = "LLR-175"
title = "approval-boundary validation proves effective curated content is approved and producible"
owner = "tool"
traces_to = ["b38bb4e4-c479-4973-830a-802111cc1cad"]
modules = ["evidence_core::corpus::approval_boundary"]
description = """
Under explicit enforcement, approval-boundary validation
keeps requirement claim behavior identical and adds the
patch plane: every committed patch's lifecycle is
evaluated, and an approved patch must apply cleanly
against its bound revision's committed parser graph under
its recorded bindings and the revision's media type, so
the corpus never claims approved curated content that
cannot become effective. A non-approved patch contributes
nothing and is no violation; a malformed graph or an
approved patch that fails application fails closed with a
typed error carrying the full source chain. Agent-facing
surfaces gain no approval or rejection capability.
"""
verification_methods = ["test"]

[[requirements]]
uid = "fa33f7b4-cf2f-4cce-880b-720e5515d83f"
id = "LLR-176"
title = "compare_reingestion is a pure read-only API that refuses invalid prerequisites with typed context"
owner = "tool"
traces_to = ["15844f5e-54c7-49e3-abda-ce438d758902"]
modules = ["evidence_core::corpus::drift"]
description = """
`corpus::drift::compare_reingestion` takes the committed
corpus graph with the baseline recipe and verified-input
digests, the candidate recipe identity, verified-input
digest, parser graph, patch set, and both planes' patch
review evaluations, and returns a typed `DriftReport`.
The function is pure: no I/O, no environment reads, no
mutable state, no writes of any kind. Prerequisite
validation runs first in a documented order: the
committed corpus graph must pass `CorpusGraph::validate`,
the named source revision must exist, the candidate
parser graph must pass the standalone source-graph
validator under the revision's media type, and every
committed and candidate patch must carry a review
evaluation; the first failure refuses the comparison
through a flat typed `DriftError` naming the broken
prerequisite, before any finding is computed. The
function never mints committed identities, never applies
unapproved patches, never mutates any input, and leaves
every input byte-identical.
"""
verification_methods = ["test"]

[[requirements]]
uid = "431fa97f-5663-41b4-8d06-f9b11840f30b"
id = "LLR-177"
title = "node-plane drift reconciles candidates through structural keys and reports per-field and locator categories"
owner = "tool"
traces_to = ["f3b490ad-a4dc-409f-bc81-799b024bbdca"]
modules = ["evidence_core::corpus::drift"]
description = """
Candidate nodes reconcile against the committed graph
through the `identity` module's structural-key
reconciliation; minted throwaway uids for unmatched
candidates never escape into findings. A matched pair
compares kind, parent, ordinal, label, canonical text,
content digest, structural fingerprint, and the semantic
locator fields (path or canonical URL, anchor or
fragment, heading path, locator variant), each change
its own closed `DriftCategory`; diagnostic-only position
fields (byte range, DOM path, page, bounding box,
printed label, final URL, git blob) report only the
distinct `DiagnosticLocatorMoved` category and never a
semantic one. Because the key embeds kind, ordinal, parent,
and explicit identity, a node whose kind, ordinal, parent,
or explicit identity moved never primary-matches; unmatched
nodes re-pair deterministically — identical content digests
pair first across the whole unmatched set, then the
remainder pairs within a kind-erased structural skeleton in
uid order — and a re-paired couple compares field by field
like a primary match, so such moves report the per-field
categories rather than a removal plus an addition. A
committed node left unpaired is `NodeRemoved`; an unpaired
candidate is `NodeAdded`, keyed by its candidate identity
and structural path; a structural key claimed by more than
one committed node is formally ambiguous, so every
candidate consuming such a pool reports `NodeUnreconciled`
instead of a field-level comparison. Findings carry the
node uid, a deterministic structural path, and the old and
new values of the changed field.
"""
verification_methods = ["test"]

[[requirements]]
uid = "057c5161-3850-4390-b6cc-0eb707d7e029"
id = "LLR-178"
title = "patch, review, and effective planes report closed categories with aggregate safety and explicit equality"
owner = "tool"
traces_to = ["f3b490ad-a4dc-409f-bc81-799b024bbdca"]
modules = ["evidence_core::corpus::drift"]
description = """
Patch drift compares the two planes by patch uid:
committed-only is `PatchRemoved`, candidate-only is
`PatchAdded`, a moved reviewed-content digest is
`PatchChanged`, a candidate evaluation of `Stale` is
`PatchStale`, of `Rejected` is `PatchRejected`, and a
patch whose reviewed-content digest does not recompute
or whose approved application against the candidate
graph fails is `PatchUnappliable` — each a per-item
finding that never suppresses later findings. A
differing evaluated lifecycle state between the planes
is `ReviewStateChanged`. The effective plane applies
each side's approved patches in uid order over its
parser graph — candidate, rejected, and stale patches
never contribute, and a failed approved candidate patch
is excluded after its `PatchUnappliable` finding — and
compares the canonical graph digests, reporting
`EffectiveGraphChanged` on any difference. Recipe and
verified-input planes compare their digests, with an
absent candidate identity reported as changed or
unavailable. Zero findings yields explicit equality;
otherwise findings sort by source document, source
revision, category, structural path, and uid, so
reordered inputs digest to identical reports.
"""
verification_methods = ["test"]
