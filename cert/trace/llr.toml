[[requirements]]
uid = "1f76ff59-e4ef-44c5-8c1e-110a627a25fc"
id = "LLR-150"
title = "cmd_init writes the managed template set: empty-commented trace files, floors.toml, boundary + profile stubs"
owner = "tool"
traces_to = ["1cba1b0c-4578-4113-9c61-336d5af0eaba"]
modules = [
    "cargo_evidence::cli::init::cmd_init",
    "cargo_evidence::cli::init::templates",
]
description = """
`cmd_init` renders and writes one managed template set:
`cert/boundary.toml` (version string flowed from
`schema_versions::BOUNDARY`), the three
`cert/profiles/{dev,cert,record}.toml` stubs,
`cert/floors.toml`, and the five
`cert/trace/{sys,hlr,llr,tests,derived}.toml` files (version
string flowed from `schema_versions::TRACE`).

Each trace template carries `[schema]` + `[meta]` plus an
explicit empty entry array (`requirements = []`, or `tests = []`
for the test layer) placed ahead of the first table header so the
files parse through `read_all_trace_files` immediately after
scaffolding. The worked example entry in each file is present
only as comment lines — every line of the example carries a
leading `#`, so no placeholder entry parses as a live requirement
and an unmodified scaffold contributes zero entries to any bundle.
The commentary names `cargo evidence trace --backfill-uuids` as
the UUID-assignment step for real entries.

`cert/floors.toml` carries `schema_version = 1`, every
workspace-true floor dimension (`diagnostic_codes`,
`terminal_codes`, the four per-layer trace counters,
`known_surfaces`) at zero as an honest pre-adoption baseline, and
