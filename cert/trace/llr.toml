as `Loaded`, so doctor's floors check never reports
`DOCTOR_FLOORS_MISSING` on a fresh scaffold.

Each written file goes through `emit_template_written`, so the
jsonl stream carries one `INIT_TEMPLATE_WRITTEN` info event per
created file and terminates in exactly one `INIT_OK` terminal.
"""
