A Rust `#[test] fn` suite in
`crates/evidence-core/tests/rot_prone_markers_locked.rs` walks every
`.rs` file under `crates/**/src/**` and `crates/**/tests/**`,
every `.md` at the workspace root and under `crates/` (excluding
`cert/trace/` and CHANGELOG.md), and every `cert/**/*.toml` outside
`cert/trace/`. For `.rs` files the pinned regex pattern set applies
to extracted comment lines only — line, doc, and block comments
pulled out by a dependency-free lexer sibling module
(`rot_prone_markers_locked/rust_comments.rs`) that skips string
literals, raw strings (any hash count), byte strings, and char
literals (lifetime heuristic documented in the module) — so runtime
string data carrying the same words stays legitimate. Markdown and
TOML are scanned whole-file: they are policy prose with no
string-literal ambiguity. The pattern set pins PR-number
breadcrumbs, bare issue numbers, pre-/post-PR and review-round
narrative, absolute line counts, newness adjectives, forward split
hints, and the temporal-phrasing class — `migrated from`,
`previously`, `historically`, `formerly`, `before this module` —
the CONTRIBUTING WHY-only-comment rule. Failures report `file:line`
via `assert!`; no `Diagnostic` wire shape; no `RULES` entry.
Follows the `schema_versions_locked` / `diagnostic_codes_locked` /
`floors_equal_current_no_slack` pattern — the test's failure
message is the diagnostic. `RESERVED_TEXT_REFS` is the exemption
mechanism: filename-suffix entries with written justification,
currently empty; `path:line` pins are forbidden (an unrelated edit
that moves the pinned text would silently break the exemption) and
a dedicated test rejects them. CHANGELOG.md and `cert/trace/**`
stay excluded as audit journals, and `used to` is deliberately
unpatterned (its instrumental reading is legitimate).
"""
verification_methods = ["test"]

