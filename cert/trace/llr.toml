traces_to = ["f98775e6-d2b3-4eef-9415-828869141bcc"]
modules = ["evidence_core::corpus::source::lineage"]
description = """
`effective_source_heads` returns a `BTreeMap<String, String>`
from document key to the effective head revision uid — the
revision of that document key no other revision supersedes — so
the view is deterministic, independent of file layout and record
insertion order, and never selected by timestamps. On a validated
graph each document key yields exactly one head. The function is
pure: no I/O, no environment reads, no stored state.
"""
