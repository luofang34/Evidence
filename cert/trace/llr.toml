emits = [
    "INIT_TEMPLATE_WRITTEN",
    "INIT_OK",
]

[[requirements]]
uid = "5bc3eea9-a497-4732-a525-7c057a5de6f2"
id = "LLR-151"
title = "init signals the adoption-incomplete state and preserves user evidence on re-run"
owner = "tool"
traces_to = ["1cba1b0c-4578-4113-9c61-336d5af0eaba"]
modules = ["cargo_evidence::cli::init::cmd_init"]
description = """
`cmd_init` is idempotent and honest about the scaffold it
produces.

Re-run semantics are per managed file: without `--force`, a file
that already exists on disk is preserved byte-for-byte (reported
as preserved, not rewritten), missing files are written, and the
run exits successfully — the retired `INIT_CERT_DIR_EXISTS` hard
refusal no longer fires on a present `cert/` tree. With `--force`,
exactly the managed template set is rewritten; anything outside
that set — real requirements the user added to the trace files'
entry lists, edited boundary or floors config, unrelated files
under `cert/` — is never touched by either mode. The
agent-context files (`CLAUDE.md`, `.claude/settings.json`) remain
preserve-always under both modes.

Because the fresh scaffold holds zero live requirements, init
names that state itself rather than leaving the user to discover
it at `trace --validate`: the jsonl stream emits one
`INIT_ADOPTION_INCOMPLETE` info diagnostic ahead of the `INIT_OK`
terminal (a finding, not a second terminal — Schema Rule 1), and
the human output prints the same state plus the complete ordered
next-step sequence: edit `cert/boundary.toml`, add real
requirements to the trace files, `cargo evidence trace
--backfill-uuids`, `cargo evidence trace --validate`, `cargo
evidence doctor`, `cargo evidence generate --out-dir evidence`.
"""
verification_methods = ["test"]
emits = ["INIT_ADOPTION_INCOMPLETE"]

