[[requirements]]
uid = "5c2ce59b-5a6e-4f4c-903e-ca4c2a3cb778"
id = "LLR-117"
title = "corpus::lifecycle evaluates the lifecycle truth table over effective review heads as a pure function"
owner = "tool"
traces_to = ["6f9137b9-00ea-4cc2-9794-ea0e145a9203"]
modules = ["evidence_core::corpus::lifecycle"]
description = """
`RequirementLifecycle` (`Candidate` / `Approved` / `Rejected` /
`Stale`, with `as_str` wire strings) and `LifecycleEvaluation`
(requirement uid, state, current digest, sorted effective review
uids) are evaluated-view types documented as never stored on
nodes. `evaluate_lifecycle` computes the current digest with
`review_content_digest_v1` over the graph's review-content
projection, collects the effective heads — the requirement's
reviews minus any review named as a `Supersedes` target — and
applies the truth table: any current-digest rejection yields
`Rejected`; else any current-digest approval yields `Approved`;
else any older-digest approval yields `Stale`; else `Candidate`.
`reviewed_at` and node order never enter the decision. A review
whose content schema differs from the supported projection cannot
load — records fail closed at parse — and the graph invariant
rejects a programmatically built mismatch at validation, so the
evaluator needs no runtime schema handling. Both public entry
points run `CorpusGraph::validate` once per call before any state
is derived: a malformed graph — a dangling or kind-mismatched
edge, a review node/edge/schema invariant violation, or
supersession malformation — fails closed with
`LifecycleError::InvalidGraph`, which carries the `CorpusError`
as its typed source so callers can inspect the exact broken
invariant; no malformed review graph can produce a lifecycle
state. On a valid graph the per-requirement fail-closed checks
remain as defense in depth: an absent uid is
`LifecycleError::RequirementMissing`.
"""
verification_methods = ["test"]

[[requirements]]
