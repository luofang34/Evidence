modules = ["evidence_core::corpus::graph"]
description = """
`CorpusGraph` stores nodes in a `BTreeMap` keyed by uid. `insert`
returns `CorpusError::DuplicateUid` when the uid is already present
regardless of node kind, and `CorpusError::DuplicateHumanId` when a
human id repeats within `Requirement` or within `Test`. Native
requirement records accept only `req_<UUIDv4>` identities.

