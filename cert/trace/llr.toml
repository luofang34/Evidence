[[requirements]]
uid = "c5b6d67a-603c-4e74-9197-10419a5495c0"
id = "LLR-009"
title = "RecipeManifest projects the canonical recipe identity"
owner = "tool"
traces_to = ["6947e635-4f6b-4833-a101-f896b8ae59c9"]
modules = [
    "evidence_core::env::manifest::RecipeManifest",
    "evidence_core::env::fingerprint::EnvFingerprint::recipe_manifest",
]
description = """
RecipeManifest is derived from EnvFingerprint plus the recorded
build inputs by projecting the canonical recipe identity in a
documented field order: toolchain (rustc, cargo, llvm_version,
rust_toolchain_toml, rustflags), cargo_lock_hash, target_triple,
profile, features (empty until the tool gains cargo feature
selection), locked_graph_hash (SHA-256 of the canonical
resolved-dependency projection, null when the bundle carries no
cargo_metadata.json), command_recipe_hash (SHA-256 of the
canonical commands.json content), inputs_hash (SHA-256 of the
canonical source-input digest map), and resolution_policy, with
git_sha / git_branch / git_dirty retained as source metadata.
Its SHA-256 lands in index.json.recipe_hash. The hash proves
same declared recipe — never that outputs reproduce; output
equality is the reproduction comparison's claim.
"""
verification_methods = ["test"]
emits = [
    "VERIFY_MANIFEST_PROJECTION_DRIFT",
    "VERIFY_DETERMINISTIC_HASH_MISMATCH",
]

