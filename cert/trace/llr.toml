`evaluate_all_lifecycles` evaluates every requirement node and
returns a `BTreeMap` keyed by requirement uid so reporting order
is deterministic; `evaluate_lifecycle` on an absent uid fails
with `LifecycleError::RequirementMissing`, and the review-target
scan behind `LifecycleError::ApprovalTargetsMissingRequirement`
is retained as defense in depth — validation rejects every graph
that could reach it (the review's `Reviews` edge dangles).
`CorpusGraph` gains the two read-only accessors the evaluator
composes: `reviews_for_requirement`, the uid-ordered review nodes
targeting one requirement, and `superseded_review_uids`, the set
of reviews named as a `Supersedes` target; nodes carry no
