present with a byte-for-byte-equal typed
`SourceRevisionProjection` — every node field plus the owned
supersession edge — with a missing revision a typed
`SourceTransitionRemoval` and any field difference a typed
`SourceTransitionMutation` naming the revision uid and the
differing field, so a replaced digest is a mutation, never an
update. A new revision of an existing document key must own a
supersession edge to that document's prior effective head or fail
as a typed `SourceTransitionCompetingHead`; new document keys are
free, non-source nodes are ignored, and the proposed graph is
itself validated so an `Ok` transition implies two valid graphs.
Both validations and every comparison run with no I/O and no
environment reads.
"""
verification_methods = ["test"]

[[requirements]]
uid = "535e526e-c1cd-4a39-b5a7-3e6fcfb2e6b6"
id = "LLR-133"
title = "corpus::source::lock derives the lock value from effective source heads as a pure projection"
owner = "tool"
traces_to = ["60a9bf68-4a18-44ae-8fc5-81b63606945d"]
modules = ["evidence_core::corpus::source::lock"]
description = """
`SourceLock` shall hold `schema_version` plus entries sorted by
document key then source uid; `SourceLockEntry` shall bind the
document key, the effective source uid, a `LockAvailability`
(`available` | `unavailable`), an optional validated
`SourceContentDigest` (absent iff unavailable), an optional
`LockCaptureMode` (`vendored` | `hash_only` | `external_controlled`,
absent iff unavailable), and an optional `ExternalControlId`
(controlling system plus immutable id, present iff
external-controlled). `derive_lock` shall project each effective
head reported by `effective_source_heads`: available material
binds its declared digest, capture mode, and — for
external-controlled capture — the controlling system and immutable
id; unavailable material yields an explicit unavailable entry with
no digest and no capture mode, never a synthetic value. Retrieval
timestamps, unavailability reasons, vendored wire paths, titles,
media types, canonical locations, file layout, and record order
shall never enter the projection, and historical non-head
revisions shall never appear as active entries. The function
shall be pure: no I/O, no environment reads.
"""
verification_methods = ["test"]

[[requirements]]
uid = "ee77ade4-d3a4-43b2-9bea-0684163f7bd0"
id = "LLR-134"
title = "corpus::source::lock renders one canonical byte template and parses strict lock bytes"
owner = "tool"
traces_to = ["60a9bf68-4a18-44ae-8fc5-81b63606945d"]
modules = ["evidence_core::corpus::source::lock"]
description = """
`render_lock_canonical` shall emit the documented canonical TOML
template — the schema header, then one `[[entries]]` table per
entry in sorted order with fields in fixed order (`document_key`,
`source_uid`, `availability`, then `sha256` and `capture_mode` for
available entries, then an inline `external_control` table for
external-controlled entries), LF line endings, exactly one blank
line between tables, and a single trailing newline — so equivalent
locks render byte-identically and a golden fixture can byte-lock
the complete contract. `parse_lock` shall parse strict bytes:
unknown fields, malformed digests, a digest or capture field on an
unavailable entry, and a `schema_version` newer than
`SUPPORTED_LOCK_SCHEMA` shall fail closed with typed errors;
duplicate document keys shall fail at parse with a typed
duplicate-key error; entry order shall be accepted as written and
left for the canonicality gate.
"""
verification_methods = ["test"]

[[requirements]]
uid = "237aafc8-abae-4a20-aad6-685f350e439c"
id = "LLR-135"
title = "corpus::source::lock validates a committed lock through three ordered gates and reads lock files without mutation"
owner = "tool"
traces_to = ["26085b95-4b44-42b4-8d82-db3e6283c4c3"]
modules = [
    "evidence_core::corpus::source::lock",
    "evidence_core::corpus::source::error",
]
description = """
`validate_committed_lock` shall validate the graph first — a
failure surfaces as a typed error carrying the `CorpusError` as
its source — then apply the three ordered gates: strict parse
(typed parse, schema-too-new, and duplicate-key failures),
canonical-byte equality (a typed non-canonical error carrying
first-difference detail), and projection equality (typed missing,
extra, and changed errors, the change naming the document key and
the field — uid, digest, availability, capture mode, or external
identity). Difference reports shall iterate in sorted document-key
order so the reported entry is load-order independent. All gate
functions shall be pure; `read_lock_blocking` shall be the only
I/O, a blocking reader returning the parsed lock that never
writes. Lock failures shall report through a `SourceLockError`
taxonomy wrapped by `SourceError`, keeping `CorpusError::Source`
the only corpus wrapper.
"""
verification_methods = ["test"]

[[requirements]]
uid = "3d0f4f2d-2a8e-4dc5-8d1b-16c18dcc8522"
id = "LLR-136"
title = "corpus::source::verify reports one typed verification state per effective head capture mode"
owner = "tool"
traces_to = ["c4c2fd84-1783-43c7-b603-6d887758dfb0"]
modules = ["evidence_core::corpus::source::verify"]
description = """
`SourceVerificationState` shall be a deterministic typed enum —
`VerifiedBytes`, `DigestDeclared`, `ExternallyControlled`, and
`Unavailable { reason }` — with a stable `as_str` wire string per
state and rustdoc recording that only `VerifiedBytes` is local byte
verification. `SourceVerification` shall bind one
`(document_key, source_uid)` pair to a
`Result<SourceVerificationState, SourcePayloadError>` outcome so a
payload finding is data, never an abort. Per-head dispatch shall
map unavailable material to `Unavailable` with its recorded reason,
hash-only material to `DigestDeclared` (the record's canonical
location and digest are guaranteed by record validation; nothing is
fetched), and external-controlled material to `ExternallyControlled`
(the external system is never contacted); vendored material shall
run the resolution and hashing pipeline of LLR-137.
"""
verification_methods = ["test"]

[[requirements]]
uid = "1746aa02-06b0-4bb3-9d7d-52799a3a36ad"
id = "LLR-137"
title = "corpus::source::verify resolves vendored payloads beneath the fixed sources root and hashes raw bytes with typed payload errors"
owner = "tool"
traces_to = ["c4c2fd84-1783-43c7-b603-6d887758dfb0"]
modules = ["evidence_core::corpus::source::verify"]
description = """
Vendored resolution shall treat the record's wire path as
corpus-root-relative with its leading `sources/` component — the
stored wire form — joining it against the corpus root and requiring
the result beneath the fixed `<corpus-root>/sources/` payload root.
The record-load lexical check shall be re-run as defense in depth;
an absolute path, a parent component, or a path not beneath the
payload root shall fail as `PathEscape`. Every filesystem step
shall use `symlink_metadata`: a symlinked payload root fails as
`SymlinkRoot`, a symlinked path component as `SymlinkComponent`, a
missing path as `MissingPayload`, and a non-regular-file final
component as `NotAFile`; the canonicalized target shall stay
beneath the canonicalized payload root or fail as `PathEscape`.
The exact raw bytes shall then stream through SHA-256; a lock entry
disagreeing with the record shall fail as `LockDisagreement`
naming the field, and bytes digesting differently than declared
shall fail as `DigestMismatch` carrying the expected and actual
digests. Every payload error shall carry the source uid, document
key, and path where applicable, and I/O failures shall carry the
underlying `io::Error`.
"""
verification_methods = ["test"]

[[requirements]]
uid = "262dcfe8-148e-4d67-a89b-ef116de0b32c"
id = "LLR-138"
title = "corpus::source::verify gates the batch on the committed-lock gates and isolates sorted per-head findings"
owner = "tool"
traces_to = ["bacd6664-7fd4-4cbc-aa70-447018a066ac"]
modules = ["evidence_core::corpus::source::verify"]
description = """
`verify_effective_sources(corpus_root, graph, lock_bytes)` shall
run `validate_committed_lock` first so graph validation, strict
lock parsing, canonical byte equality, and graph-lock equality
remain one implementation whose typed failure stops the batch
before any payload is read. After the gates pass, the batch shall
iterate `effective_source_heads` — `BTreeMap` order, so results
are sorted by document key then source uid with no re-sort — and
shall collect exactly one `SourceVerification` per head, matching
each head to its lock entry; a missing entry shall be a typed
`LockDisagreement` finding, never a panic. A per-head payload
finding shall never abort the loop. The only I/O shall be
read-only: payload reads and hashing beneath the payload root; the
batch shall never write registry, lock, review, or payload files,
shall never touch the network, and retrieval timestamps shall never
affect ordering or state selection.
"""
verification_methods = ["test"]
