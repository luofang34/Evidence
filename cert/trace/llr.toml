[[requirements]]
uid = "a81bbe08-6260-4f03-934d-984418dd79c6"
id = "LLR-119"
title = "corpus::approval_boundary types make the enforcement policy explicit with no default and no silent weakening"
owner = "tool"
traces_to = ["38941e91-e8a1-4977-8c19-38b5640ef5cf"]
modules = ["evidence_core::corpus::approval_boundary"]
description = """
`LifecycleEnforcement` is the explicit policy input: a single
`Required` variant, no `Default`, no serde — callers must name
the policy in code, and an exhaustive match in the module's own
tests pins the variant set so a weaker policy cannot appear
unnoticed. `ApprovalBoundaryViolation` carries the requirement
uid, the human-readable id, the evaluated
`RequirementLifecycle` (candidate, rejected, or stale — never
approved), and the `ReferringArtifact`: `Test` (test uid and
id), `ImplementationModules` (claimed modules), or
`EmittedDiagnostics` (claimed codes); its `Ord` derivation
documents the deterministic sort — test violations first, then
module claims, then emitted-diagnostic claims, payload fields
breaking ties. `ApprovalBoundaryError` is a flat thiserror enum:
`Violations` aggregating every violation with a one-line-per-
violation uid-sorted `Display`, and `Lifecycle` wrapping a
`LifecycleError` for fail-closed evaluator failures.
Impossible-invariant failures keep their full typed source chain
through the boundary — `LifecycleError::InvalidGraph` carrying
the `CorpusError` (itself possibly wrapping a `ReviewError`) as
its typed source, never a string — so callers can match the exact
broken invariant; they are never flattened into `Violations` and
never silently skipped.
"""
verification_methods = ["test"]

[[requirements]]
uid = "45cb08f4-9051-4780-86fa-9e0adbfcd61f"
id = "LLR-120"
title = "validate_approval_boundary scans verifies edges and metadata claims against evaluated lifecycles in deterministic order"
owner = "tool"
traces_to = ["db587696-1d94-451f-a275-0b504af4f6aa"]
modules = ["evidence_core::corpus::approval_boundary"]
description = """
`validate_approval_boundary` runs `evaluate_all_lifecycles`
once — which validates the whole graph first, so a malformed
graph (a dangling edge, a review-graph invariant violation)
fails closed as `ApprovalBoundaryError::Lifecycle` wrapping
`LifecycleError::InvalidGraph` with the `CorpusError` source
chain preserved, before any claim is scanned — then scans every
test node's `Verifies` edge: a target
whose evaluated state is not `Approved` yields a
`ReferringArtifact::Test` violation naming the test uid and id.
The scan's own `LifecycleError::RequirementMissing` branch for a
target naming no requirement node is defense in depth:
validation rejects every such graph first (the edge dangles or
its target kind mismatches), so the branch is unreachable
through validate-first evaluation. For
every requirement node it reads the graph's trace metadata and
gates legacy-populated claims: non-empty `modules` yields an
`ImplementationModules` violation and non-empty `emits` an
`EmittedDiagnostics` violation when the requirement is not
approved — two distinct violation kinds, one node may produce
both. Violations aggregate and sort by requirement uid then
referring artifact; approved targets pass silently;
`DerivesFrom` edges are never scanned. The function is pure:
no I/O, no environment reads, no statics.
"""
verification_methods = ["test"]

[[requirements]]
uid = "398e24ac-9e53-4181-b3f4-63990270a93d"
id = "LLR-121"
title = "the approval boundary fails closed over zero reviews and never grandfathers legacy graphs"
owner = "tool"
traces_to = ["db587696-1d94-451f-a275-0b504af4f6aa"]
modules = ["evidence_core::corpus::approval_boundary"]
description = """
A graph with no review nodes evaluates every requirement as
`Candidate` (missing reviews are never implicitly approved), so
under explicit enforcement every would-be-gated claim — each
verifies edge and each module or emitted-diagnostic claim —
produces a violation: an explicitly requested approval claim
over zero reviews can never succeed. Zero reviews alone are not
a failure, though: an empty review set fails closed only when a
gated claim exists, and a zero-review graph with no gated claims
yields `Ok(())` — enforcement gates claims, not the existence
of requirements. The module rustdoc states
the compatibility boundary: legacy graphs are not grandfathered
inside the validator — callers that have not adopted corpus
lifecycle simply do not call it — and native requirement records
carry no modules or emits fields, so the implementation-claim
gate applies to claims present in the graph (populated by the
legacy adapter); native-record support is a documented non-goal.
Candidate decomposition stays usable because `DerivesFrom`
edges are never gated. A requirement node missing from the
lifecycle evaluation map is an impossible invariant: the scan
returns the typed
`ApprovalBoundaryError::InvariantMissingEvaluation` naming the
requirement uid rather than silently skipping its claims.
"""
verification_methods = ["test"]

[[requirements]]
uid = "d91963ae-0de7-4155-a61c-eed53d48290b"
id = "LLR-122"
title = "corpus::proposal schema types represent exactly two actions and fail closed on every other shape"
owner = "tool"
traces_to = ["bd2ff320-9f15-432f-bc1b-54c2e6b3116d"]
modules = ["evidence_core::corpus::proposal"]
description = """
`SUPPORTED_PROPOSAL_SCHEMA` pins the record schema at 1 and
`PROPOSAL_UID_PREFIX` at `prop_`. `ProposalAction` is a serde
snake_case tagged enum with exactly two variants:
`CreateCandidate { candidate_uid, content }` — the candidate uid
is store-minted, validated as req_UUIDv4 on read — and
`ReviseCandidate { base_uid, expected_current_digest, content }`;
unknown action tags fail deserialization, so approve, reject,
delete, review-mutation, source-mutation, baseline-write, and
file-path-write actions are unrepresentable.
`ProposedRequirementContent` mirrors the
`RequirementReviewContentV1` projection fields — title, layer,
description, rationale, scope, category, source, verification
methods, derives_from, and safety_impact — and nothing else;
safety_impact is optional free text under the same contract as
the native record: normative for derived-layer proposals,
tolerated as `None` for other layers. `ProposalFile` and
`ProposalRecord` are strict `deny_unknown_fields` structs: record
uid validated through the shared corpus-native uid helper,
submitter required non-empty as audit identity that the rustdoc
states is never authority, and `submitted_at` chrono-validated as
RFC 3339 metadata that never orders. The proposed content is
validated semantically on BOTH append (before any write) and
strict read-back: `title` must be non-empty after trimming
(`ProposalContentTitle`); every `derives_from` entry must be a
valid `req_<UUIDv4>` — routed through the shared corpus-native
uid helper with the proposal error constructors — and the list
duplicate-free (`ProposalContentDerivesFrom` naming the
duplicate); and `verification_methods`, allowed to be empty in
mirroring of the review-content contract, must be sorted and
duplicate-free as written
(`ProposalContentVerificationMethodsOrder` naming the first
out-of-order pair, `ProposalContentVerificationMethodsDuplicate`
naming the duplicate). The ordering rule is deliberately stricter
than the projection's silent canonicalization: a proposal must
arrive in canonical form. Every validation failure is a typed
`ProposalError` naming the file path.
"""
verification_methods = ["test"]

[[requirements]]
uid = "ef446b31-43a2-4c07-9a6e-a821a41c87db"
id = "LLR-123"
title = "ProposalStore validates its root, mints all identities, writes exclusively, and reads back fail-closed"
owner = "tool"
traces_to = ["2ba5d4a0-78c9-4e81-aa80-f3781b6547fd"]
modules = ["evidence_core::corpus::proposal"]
description = """
`ProposalStore::new` rejects a missing root, a non-directory
root, and a symlink root via `symlink_metadata`, then stores the
canonicalized path. `append_create_candidate_blocking` mints both
the `prop_` proposal uid and the `req_` candidate uid with
`uuid::Uuid::new_v4`; `append_revise_candidate_blocking` mints
only the proposal uid; both mint `submitted_at` from
`chrono::Utc::now` so no caller clock or uid reaches the record.
Each append serializes the full `ProposalFile` with
`toml::to_string_pretty` and writes it to the generated basename
`<prop_uid>.toml` inside the root using
`OpenOptions::create_new(true)` exclusive creation: an existing
file yields `ProposalExists` and is never overwritten, and any
mid-write I/O error removes the partial file best-effort before
returning `ProposalWrite`. `AppendOutcome` returns the created
path, proposal uid, optional candidate uid, and the typed digest
of the exact bytes written — a `ProposalFileDigest`: SHA-256 over
the raw proposal FILE BYTES, a domain distinct from
`ReviewContentDigest` (SHA-256 over the canonical review-content
encoding). The two domains are separate validated types and never
interchangeable; `ProposalFileDigest` mirrors the review-digest
contract style, with `from_hex` failing closed on anything but
exactly 64 lowercase hexadecimal characters and serde
deserializing through the validating constructor.
`read_proposal_blocking` parses the
record strictly so a malformed or partially written proposal
fails closed with the path. The store never lists the root and
never touches anything outside it.
"""
verification_methods = ["test"]

[[requirements]]
