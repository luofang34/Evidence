`reviewed_at` must parse as RFC 3339 via the workspace's chrono
dependency; reviewer and human id must be non-empty after
trimming; and a reject decision without a non-empty rationale
fails. Each failure returns a typed `ReviewError` — the review
error taxonomy split out of `CorpusError`, which wraps it so
`load_graph` keeps one error type — naming the file path plus the
record id and uid; valid records insert a `ReviewNode` carrying a
`Reviews` edge to the requirement and an optional `Supersedes`
edge to the predecessor review. Graph insertion failures lift
into the review taxonomy field for field across `insert`'s closed
contract — identity collisions and duplicate edges — while any
out-of-contract variant is preserved whole as the typed source of
`ReviewError::UnexpectedInsertError`: an upstream contract change
degrades to a typed error, never a panic.
"""
verification_methods = ["test"]

[[requirements]]
uid = "3f7c8e17-f56e-42f7-be13-2955609b2d6b"
id = "LLR-115"
title = "The corpus graph types review nodes and edges and validates supersession chains deterministically"
owner = "tool"
traces_to = ["ac1e1019-f2ad-4061-ba29-a42edad03389"]
modules = ["evidence_core::corpus::graph"]
description = """
`NodeKind::Review`, `ReviewDecision` (serde snake_case `approve` /
`reject`), and `ReviewNode` — uid, human id, requirement uid,
content schema, typed reviewed-content digest, decision, reviewer,
RFC 3339 timestamp, optional rationale, and typed edges — join the
graph alongside requirements and tests. `EdgeKind::Reviews`
accepts only Review-to-Requirement and `EdgeKind::Supersedes`
only Review-to-Review; every other combination fails with
`InvalidEdgeKinds`. `CorpusGraph::validate` then enforces the
per-node review invariants on every graph — loaded or
programmatically built — before any chain check: exactly one
`Reviews` edge per review node, agreement between that edge's
target and the node's requirement-uid field, and the supported
content schema, so a malformed review node fails closed instead
of poisoning chain validation. Supersession validation follows:
per review node it rejects more than one outgoing `Supersedes`
edge — a review corrects at most one predecessor — and per edge
it rejects self-supersession and any reviewer,
requirement-uid, or digest mismatch against the predecessor with
distinct errors naming both uids; it then rejects forks (more
than one incoming supersession per review, the dual direction of
the per-node outgoing check) and cycles found by walking the
supersession chain, all in uid-sorted order so
results are independent of load order. Review violations surface
as the typed `ReviewError` (split out of `CorpusError`, which
wraps it); the record loader satisfies the node invariants and
the singular outgoing supersession by construction — a record
names a single optional `supersedes_review_uid` — so the
graph-level checks are what guards programmatically constructed
graphs.
"""
verification_methods = ["test"]

