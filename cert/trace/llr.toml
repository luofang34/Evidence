[[requirements]]
uid = "8375047f-97d9-412c-9b78-ef966be7fee8"
id = "LLR-156"
title = "corpus::source_graph carries the structural node, closed kind enum, per-revision graph, and kind-legality table"
owner = "tool"
traces_to = ["f89519cc-35d8-4ef7-89bb-258bdad54a61"]
modules = ["evidence_core::corpus::source_graph"]
description = """
`SourceNode` is the committed structural record: `uid`,
`source_revision_uid`, optional `parent_uid`, `kind`,
`ordinal`, optional `label`, `canonical_text`,
`content_sha256`, `fingerprint`, and one typed `locator` — page,
DOM, byte, and line positions live only inside the locator as
diagnostics. `SourceNodeKind` is a closed eleven-variant enum
(Section, Paragraph, ListItem, DefinitionTerm, DefinitionBody,
Table, TableRow, TableCell, CodeBlock, Note, FigureCaption)
serializing snake_case. `SourceGraph` holds one source
revision's nodes in a `BTreeMap` keyed by uid, so iteration,
equality, and canonical rendering are independent of insertion
order, file layout, parser event order, and map iteration. The
parent/child legality table is closed and minimal: Section
parents any kind, Table parents only TableRow, TableRow parents
only TableCell, and every other kind is a leaf. Insertion
rejects duplicate uids and duplicate non-blank labels within
one kind — the structural-node human identity — while sibling
ordinals validate unique and contiguous `0..n` per parent
sibling set after canonical sibling ordering.
"""
verification_methods = ["test"]

[[requirements]]
uid = "75d4411b-cda1-40d7-8c9b-f587f9ceb061"
id = "LLR-157"
title = "corpus::source_graph::validate enforces forest, binding, ordinal, kind, and digest invariants with typed errors"
owner = "tool"
traces_to = ["f89519cc-35d8-4ef7-89bb-258bdad54a61"]
modules = ["evidence_core::corpus::source_graph::validate"]
description = """
Corpus graph validation runs the source-graph invariants after
source-revision lineage: every node validates within its own
revision's forest against a global uid-to-revision index and
the committed revision media map. A parent uid absent from
every revision fails as dangling; a parent uid present only in
another revision fails as cross-revision. Parent chains are
walked to a root with a visited set so a cycle fails closed
naming a node on it. Parent/child kind pairs outside the
closed legality table fail naming both kinds. Sibling ordinal
sets per parent must be exactly `0..n` — duplicates and gaps
fail naming the parent. Each node's stored content digest and
fingerprint recompute from its kind, canonical text, label,
and ancestry, and any mismatch fails carrying the node uid,
the field, and the stored and recomputed values. Every source
graph's revision uid must name a committed source-revision
node, and each locator variant must agree with that revision's
media type under the closed Markdown/HTML/PDF mapping. All
failures are flat typed `SourceGraphError` variants.
"""
verification_methods = ["test"]

[[requirements]]
uid = "719faafa-e571-42ff-a1e4-59cd702b753b"
id = "LLR-158"
title = "corpus::source_graph::identity mints UUIDv4 node uids and reconciles candidates by structural-key precedence"
owner = "tool"
traces_to = ["20ab2a14-035d-4c34-b01f-81c4134881fa"]
modules = ["evidence_core::corpus::source_graph::identity"]
description = """
`mint_node_uid` returns `snode_` plus a fresh UUIDv4 — the only
identity-minting path, so no identity is ever derived from
content. `structural_key` computes a candidate's or committed
node's deterministic key as a precedence chain: tier one is the
explicit document numbering or anchor — a leading dotted-decimal
label token or the locator's document-author anchor — keyed with
the kind; tier two is the parent's structural key chained with
the node's kind and sibling ordinal; tier three is the
structural fingerprint over kind, label, and ancestry. The first
computable tier wins, and diagnostic positions never enter any
tier. `reconcile` matches each candidate against the committed
graph in deterministic order — keys serialize into a sorted map
whose entries resolve uid collisions to the lowest uid — reusing
the committed uid on a key match and minting a fresh UUIDv4 uid
otherwise, so a content change moves only the content digest
while identity persists, and an unmatched candidate never
inherits an identity.
"""
verification_methods = ["test"]

