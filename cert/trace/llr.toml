sorts these pairs and rejects an exact duplicate with
`CorpusError::DuplicateEdge`, making graph equality independent of
input edge order. `validate` rejects a missing target with
`CorpusError::DanglingEdge` and rejects any endpoint tuple other
than requirement→`DerivesFrom`→requirement or
test→`Verifies`→requirement with `CorpusError::InvalidEdgeKinds`.
Every edge error carries its source uid, target uid, and edge kind.
"""
