`RequirementReviewContentV1` carries title, layer, description,
rationale, scope, category, source, verification_methods,
derives_from, and safety_impact. A derived requirement's safety
impact is normative assurance content, so the v1 projection binds
it: changing safety impact from low to high must stale an existing
approval. Its constructors sort and deduplicate the two set-like
lists, matching the existing metadata-list contract; duplicate
typed edges remain a hard error at graph insertion. `from_node`
pulls the content fields from a `RequirementNode` and the
canonical targets of its `DerivesFrom` edges only — `Verifies`
edges are test mappings and excluded. `CorpusGraph::review_content`
is the pure, non-I/O convenience accessor.

`canonical_bytes_v1` emits the domain tag
`evidence/requirement-review-content/v1`, one 0x00 separator, then
the fields in a fixed documented order — title, layer as its serde
snake_case string, description, rationale, scope, category, source,
verification method count and entries, derives_from count and
entries, and safety_impact last — each framed as
`u64_be(len) || bytes` with `None` encoded as the all-ones `u64`
sentinel, so the format is independently re-implementable and the
framing prevents field-boundary collisions.
"""
verification_methods = ["test"]

