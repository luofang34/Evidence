modules = ["evidence_core::corpus::source_graph::normalization"]
description = """
`normalize_prose` applies Unicode NFC, folds every whitespace
run to one ASCII space, and trims; `normalize_code` applies
Unicode NFC and maps CRLF and lone CR line endings to LF while
preserving significant spaces and line boundaries — the two
contracts are disjoint and kind-dispatched. `content_digest`
binds the node kind's wire name and the exact canonical text
bytes under a domain-tagged, length-prefixed framing, so
identical text under different kinds digests differently and no
field-boundary collision is possible. `fingerprint` binds the
node kind, the optional label, and the ordered root-to-parent
ancestry of `(kind, label)` pairs under a separate domain tag
with the same framing; diagnostic positions — page, DOM, byte,
line, and ordinal — never enter the encoding, so a pure
re-layout never moves a fingerprint. Both digests return the
validating structural digest type, and the encoding contract is
byte-locked by golden vectors covering Unicode edge cases and
code blocks.
"""
verification_methods = ["test"]

